name: Draft Release and Create Milestone

# Reconciles the version milestones and keeps a draft release for the next version, regenerating its notes from
# .github/release.yml on every run. Callers run it on every push to the default branch (and on a schedule), in one
# concurrency group with close-milestone.yml.
on:
  workflow_call:
    inputs:
      default-label:
        description: 'Label added to merged pull requests that have no label'
        type: string
        default: ':sparkles: mysterious'
      versioning:
        description: "'semver' (labels since the latest release) or 'calver' (<year>.<month>.<releases this month>)"
        type: string
        default: 'semver'
    secrets:
      RSG_BOT_TOKEN:
        required: false
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * 4'
  workflow_dispatch:

jobs:
  draft_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Reconcile milestones and draft release
        uses: RocketSurgeonsGuild/actions/release-milestones@v0.5.0
        with:
          mode: sync
          github-token: ${{ secrets.RSG_BOT_TOKEN || github.token }}
          default-label: "${{ inputs.default-label || ':sparkles: mysterious' }}"
          versioning: ${{ inputs.versioning || 'semver' }}
