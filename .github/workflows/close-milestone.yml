name: Close Milestone

# When a release is published: files every pull request between the previous release and this one (and the issues they
# close) under its milestone, moves anything still open on to the next version, and closes the milestone. Then it
# reconciles the rest like draft-release.yml. Prereleases leave the milestones alone.
on:
  workflow_call:
    inputs:
      release-tag:
        description: 'The release that was published; defaults to the release event tag'
        type: string
        default: ''
      default-label:
        description: 'Label added to merged pull requests that have no label'
        type: string
        default: ':sparkles: mysterious'
      versioning:
        description: "'semver' (labels since the latest release) or 'calver' (<year>.<month>.<releases this month>)"
        type: string
        default: 'semver'
    secrets:
      RSG_BOT_TOKEN:
        required: false
  release:
    types:
      - published

jobs:
  close_milestone:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Close milestone
        uses: RocketSurgeonsGuild/actions/release-milestones@v0.5.0
        with:
          mode: sync
          github-token: ${{ secrets.RSG_BOT_TOKEN || github.token }}
          release-tag: ${{ inputs.release-tag || github.event.release.tag_name }}
          default-label: "${{ inputs.default-label || ':sparkles: mysterious' }}"
          versioning: ${{ inputs.versioning || 'semver' }}
