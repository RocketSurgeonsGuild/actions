name: Dependabot Commenter

on:
  workflow_call:
    # inputs:
    secrets:
      RSG_BOT_TOKEN:
        required: true
  pull_request_target:
    types:
      - labeled
      - opened
      - reopened
      - closed
      - synchronize
      - ready_for_review

jobs:
  comment:
    runs-on: ubuntu-latest
    if: |
      (github.event.action != 'closed')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Dump job context
        env:
          JOB_CONTEXT: ${{ toJson(job) }}
        run: echo "$JOB_CONTEXT"

      - name: Dump steps context
        env:
          STEPS_CONTEXT: ${{ toJson(steps) }}
        run: echo "$STEPS_CONTEXT"

      - name: Dump runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

      # GITHUB_TOKEN cannot enable auto-merge here (contents: read, and merges it queues
      # would not trigger merge_group workflows), so use the bot token instead.
      # Skips drafts and PRs that already have auto-merge on (e.g. enabled by Renovate).
      # --squash is only a fallback: on branches with a merge queue the queue sets the strategy.
      - name: GitHub Automerge
        if: |
          contains(github.event.pull_request.labels.*.name, ':shipit: merge') &&
          !github.event.pull_request.draft &&
          github.event.pull_request.auto_merge == null
        env:
          GH_TOKEN: ${{ secrets.RSG_BOT_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already enabled for $PR_URL"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
  labeler:
    runs-on: ubuntu-latest
    if: |
      (github.event.action != 'labeled')
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Dump job context
        env:
          JOB_CONTEXT: ${{ toJson(job) }}
        run: echo "$JOB_CONTEXT"

      - name: Dump steps context
        env:
          STEPS_CONTEXT: ${{ toJson(steps) }}
        run: echo "$STEPS_CONTEXT"

      - name: Dump runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

      - name: GitHub Private Dependency Labels
        if: |
          (github.event.action != 'closed') &&
          (github.event.pull_request.user.login == 'renovate[bot]' && contains(github.event.pull_request.labels.*.name, ':truck: private-dependencies'))
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: |
            :shipit: merge

      - name: GitHub Remove Labels
        if: |
          github.event.action == 'closed'
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: |
            :shipit: merge
