name: Update Milestone

# Files a pull request into the default branch under the pending version milestone while it is open or once it merges,
# and takes it back out if it is closed without merging. Callers run it on pull_request_target.
on:
  workflow_call:
    inputs:
      default-label:
        description: 'Label added to merged pull requests that have no label'
        type: string
        default: ':sparkles: mysterious'
      versioning:
        description: "'semver' (labels since the latest release) or 'calver' (<year>.<month>.<releases this month>)"
        type: string
        default: 'semver'
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  update_milestone:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Update milestone
        uses: RocketSurgeonsGuild/actions/release-milestones@v0.5.0
        with:
          mode: pull-request
          github-token: ${{ github.token }}
          default-label: "${{ inputs.default-label || ':sparkles: mysterious' }}"
          versioning: ${{ inputs.versioning || 'semver' }}
